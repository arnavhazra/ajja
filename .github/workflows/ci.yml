name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neon-proxy:
        # Speaks the Neon serverless HTTP protocol to the local Postgres, so
        # `pnpm build` prerenders real queries with no cloud dependency or secret.
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      - name: Wait for the Neon proxy
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4444/ && exit 0
            sleep 1
          done
          echo "neon proxy did not come up" && exit 1

      - name: Apply schema to the CI database
        run: |
          for f in drizzle/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d main -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Production Build
        # Next.js 16 prerenders cached queries at build time, so this needs a
        # real DATABASE_URL — here an isolated containerised Postgres (never
        # production) reached through the Neon-protocol proxy on :4444.
        run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
          BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_placeholder"
          SESSION_SECRET: "placeholder_session_secret_for_build"
          CRON_SECRET: "cron_placeholder_secret_for_build"

      - name: Bundle budgets
        run: node scripts/bundle-budget.mjs

  lighthouse:
    name: Lighthouse CWV gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare blob mock certificates
        # The seeded fixture piece's hero image lives on the blob mock, so
        # Lighthouse measures the homepage with a real photo. Same setup as
        # the E2E job: self-signed cert on :443, gitignored, regenerated.
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout e2e/.blob-mock-key.pem -out e2e/.blob-mock-cert.pem -days 1 \
            -subj "/CN=e2e.local" \
            -addext "subjectAltName=DNS:e2e.public.blob.vercel-storage.com,DNS:localhost,IP:127.0.0.1"

      - name: Map blob mock host to loopback
        run: echo "127.0.0.1 e2e.public.blob.vercel-storage.com" | sudo tee -a /etc/hosts

      - name: Allow node to bind port 443
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(which node)")"

      - name: Wait for the Neon proxy
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4444/ && exit 0
            sleep 1
          done
          echo "neon proxy did not come up" && exit 1

      - name: Apply schema and seed to the CI database
        # Same fixture rows as the E2E job: `pnpm build` prerenders cached
        # catalog queries, so a published piece must exist before the build.
        run: |
          for f in drizzle/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d main -v ON_ERROR_STOP=1 < "$f"
          done
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d main -v ON_ERROR_STOP=1 <<'SQL'
          insert into categories (slug, name, intro)
            values ('e2e-paintings', 'E2E paintings', 'Fixture art form')
            on conflict (slug) do nothing;
          insert into products (slug, title, status, category_id)
            select 'e2e-seed-photo', 'E2E seed photo', 'published', id
            from categories where slug = 'e2e-paintings'
            on conflict (slug) do nothing;
          insert into product_images (product_id, url, width, height, alt, sort_order)
            select id, 'https://e2e.public.blob.vercel-storage.com/e2e/seed-photo.jpg', 640, 480, 'E2E seed photo', 0
            from products where slug = 'e2e-seed-photo';
          SQL

      - name: Start blob mock and upload fixture image
        run: |
          node e2e/blob-mock.mjs &
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://e2e.public.blob.vercel-storage.com/healthz && break
            sleep 1
          done
          # fixture-photo.jpg is a 1600x1200 artwork-like photo (~245KB), not
          # the 322-byte solid-color tiny.jpg, so transfer/resize cost is real.
          curl -sk -X PUT --data-binary @e2e/fixture-photo.jpg \
            "https://e2e.public.blob.vercel-storage.com/?pathname=e2e/seed-photo.jpg" -o /dev/null

      - name: Production Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
          BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_placeholder"
          SESSION_SECRET: "placeholder_session_secret_for_build"
          CRON_SECRET: "cron_placeholder_secret_for_build"
          # Lets next/image fetch the loopback blob mock (see next.config.ts).
          E2E_BLOB_API_URL: "https://e2e.public.blob.vercel-storage.com"

      - name: Start production server
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3100 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3100/ && exit 0
            sleep 2
          done
          echo "server did not come up" && exit 1
        env:
          DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
          BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_placeholder"
          SESSION_SECRET: "placeholder_session_secret_for_build"
          CRON_SECRET: "cron_placeholder_secret_for_build"
          E2E_BLOB_API_URL: "https://e2e.public.blob.vercel-storage.com"
          # `next start` fetches the hero through next/image from the blob
          # mock's self-signed cert; trust it for this job only.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/e2e/.blob-mock-cert.pem

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neon-proxy:
        # Same Neon-protocol proxy as the check job: the app's DB driver
        # speaks HTTP to localhost:4444/sql, so E2E_DATABASE_URL uses a plain
        # localhost postgres URL and no cloud database or secret is involved.
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # PRs gate on Chromium only (fast); pushes to main run the full
        # three-browser matrix for cross-browser parity.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install --with-deps chromium webkit firefox
          fi

      - name: Prepare blob mock certificates
        # Self-signed cert shared by e2e/blob-mock.mjs (Blob API stand-in on
        # :443) and e2e/https-proxy.mjs (TLS in front of `next start` on
        # :3443). Gitignored; regenerated here on every run.
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout e2e/.blob-mock-key.pem -out e2e/.blob-mock-cert.pem -days 1 \
            -subj "/CN=e2e.local" \
            -addext "subjectAltName=DNS:e2e.public.blob.vercel-storage.com,DNS:localhost,IP:127.0.0.1"

      - name: Map blob mock host to loopback
        run: echo "127.0.0.1 e2e.public.blob.vercel-storage.com" | sudo tee -a /etc/hosts

      - name: Allow node to bind port 443
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(which node)")"

      - name: Wait for the Neon proxy
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4444/ && exit 0
            sleep 1
          done
          echo "neon proxy did not come up" && exit 1

      - name: Apply schema to the CI database
        run: |
          for f in drizzle/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d main -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Seed E2E fixture rows
        # `pnpm build` prerenders cached catalog queries — rows must exist
        # before the build, so the seed lives here rather than in Playwright
        # global setup (which only uploads the photo bytes to the blob mock).
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d main -v ON_ERROR_STOP=1 <<'SQL'
          insert into categories (slug, name, intro)
            values ('e2e-paintings', 'E2E paintings', 'Fixture art form')
            on conflict (slug) do nothing;
          insert into products (slug, title, status, category_id)
            select 'e2e-seed-photo', 'E2E seed photo', 'published', id
            from categories where slug = 'e2e-paintings'
            on conflict (slug) do nothing;
          insert into product_images (product_id, url, width, height, alt, sort_order)
            select id, 'https://e2e.public.blob.vercel-storage.com/e2e/seed-photo.jpg', 640, 480, 'E2E seed photo', 0
            from products where slug = 'e2e-seed-photo';
          SQL

      - name: Run E2E suite
        # playwright.prod.config.ts builds the app and serves it via
        # `next start` + TLS proxy; applyFixtureEnv points DATABASE_URL at
        # the isolated container Postgres (localhost passes the safety gate)
        # and scrubs every production companion variable. The dummy Blob
        # token satisfies assertEnv at boot; uploads land in the local mock.
        run: |
          echo "::add-mask::${E2E_DATABASE_URL}"
          echo "::add-mask::${E2E_BLOB_READ_WRITE_TOKEN}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec playwright test --config playwright.prod.config.ts --project=chromium-desktop
          else
            pnpm exec playwright test --config playwright.prod.config.ts
          fi
        env:
          E2E_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/main"
          E2E_SESSION_SECRET: "e2e-ci-session-secret-0123456789abcdef"
          E2E_BLOB_API_URL: "https://e2e.public.blob.vercel-storage.com"
          E2E_BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_e2e_ci_mock"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            screenshots/
          retention-days: 14
          if-no-files-found: ignore
