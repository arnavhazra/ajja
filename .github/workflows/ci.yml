name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      - name: Production Build
        # Next.js 16 prerenders cached queries at build time, so this needs a
        # real DATABASE_URL secret pointing at an isolated Neon branch (never production).
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_placeholder"
          SESSION_SECRET: "placeholder_session_secret_for_build"
          ADMIN_PATH: "test-admin-path-placeholder"
          CRON_SECRET: "cron_placeholder_secret_for_build"
